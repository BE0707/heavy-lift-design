<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16191E" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC820" />
      <stop offset="100%" stop-color="#E5A919" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A919" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Industrial Chamfered Background Shield -->
  <rect x="16" y="16" width="480" height="480" rx="32" fill="url(#bgGrad)" stroke="#2A2F38" stroke-width="16" />

  <!-- Top Hazard Accent Stripe -->
  <path d="M 48 32 L 88 32 L 64 64 L 24 64 Z" fill="#FDB813" opacity="0.8" />
  <path d="M 104 32 L 144 32 L 120 64 L 80 64 Z" fill="#FDB813" opacity="0.8" />
  <path d="M 160 32 L 200 32 L 176 64 L 136 64 Z" fill="#FDB813" opacity="0.8" />
  <path d="M 424 32 L 464 32 L 440 64 L 400 64 Z" fill="#FDB813" opacity="0.8" />

  <!-- Dynamic Heavy-Haulage Stylized "B" & Boomerang Monogram -->
  <g transform="translate(10, 0)">
    <!-- Vertical Heavy Spine -->
    <path d="M 120 110 L 210 110 L 210 402 L 120 402 Z" fill="url(#yellowGrad)" />

    <!-- Top Loop / Dynamic Angular Segment -->
    <path d="M 210 110 L 310 110 C 365 110 395 145 395 195 C 395 240 365 265 305 265 L 210 265 Z" fill="url(#yellowGrad)" />
    <!-- Top Negative Space Cutout -->
    <path d="M 210 162 L 295 162 C 322 162 338 175 338 192 C 338 212 320 220 295 220 L 210 220 Z" fill="#12151B" />

    <!-- Bottom Loop / Extended Heavy Segment -->
    <path d="M 210 245 L 325 245 C 385 245 422 280 422 332 C 422 388 385 402 320 402 L 210 402 Z" fill="url(#amberGrad)" />
    <!-- Bottom Negative Space Cutout -->
    <path d="M 210 295 L 305 295 C 335 295 358 308 358 335 C 358 360 335 365 305 365 L 210 365 Z" fill="#0B0D10" />

    <!-- Boomerang / Heavy Transport Chevron Accent -->
    <polygon points="120,225 175,256 120,287" fill="#0F1115" />
    <polygon points="100,225 155,256 100,287" fill="#FDB813" />
  </g>

  <!-- Technical Spec Tick Marks -->
  <rect x="448" y="240" width="16" height="32" fill="#FDB813" />
  <rect x="448" y="280" width="8" height="8" fill="#FDB813" opacity="0.6" />
  <rect x="448" y="224" width="8" height="8" fill="#FDB813" opacity="0.6" />
</svg>
